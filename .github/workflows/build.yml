name: Build & Release (Canary / Nightly / Stable)

on:
  push:
    branches:
      - main
      - canary
    tags:
      - 'v*'
  schedule:
    # Daily nightly pre-release build at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel to build'
        required: true
        type: choice
        default: canary
        options:
          - canary
          - nightly
          - stable
      publish_mode:
        description: 'GitHub release target'
        required: true
        type: choice
        default: both
        options:
          - both
          - pre-release
          - release
          - artifacts-only

permissions:
  contents: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.inputs.channel || github.ref_name }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  NUGET_PACKAGES: ${{ runner.temp }}/nuget-packages

jobs:
  resolve:
    name: Resolve build metadata
    runs-on: windows-latest
    outputs:
      channel: ${{ steps.meta.outputs.channel }}
      version: ${{ steps.meta.outputs.version }}
      assembly_version: ${{ steps.meta.outputs.assembly_version }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      prerelease_tag: ${{ steps.meta.outputs.prerelease_tag }}
      publish_prerelease: ${{ steps.meta.outputs.publish_prerelease }}
      publish_release: ${{ steps.meta.outputs.publish_release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine channel, version, and release targets
        id: meta
        shell: pwsh
        run: |
          $cargoToml = Get-Content -Raw Cargo.toml
          $baseVersion = if ($cargoToml -match '(?m)^version\s*=\s*"([^"]+)"') { $Matches[1] } else { '0.1.5' }
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          $runNumber = $env:GITHUB_RUN_NUMBER

          $eventName = '${{ github.event_name }}'
          $refType = '${{ github.ref_type }}'
          $refName = '${{ github.ref_name }}'
          $inputChannel = '${{ github.event.inputs.channel }}'
          $publishMode = '${{ github.event.inputs.publish_mode }}'

          if ($eventName -eq 'workflow_dispatch') {
            $channel = $inputChannel
          } elseif ($refType -eq 'tag') {
            if ($refName -match '-canary\.') {
              $channel = 'canary'
            } elseif ($refName -match '-nightly\.') {
              $channel = 'nightly'
            } else {
              $channel = 'stable'
            }
          } elseif ($eventName -eq 'schedule') {
            $channel = 'nightly'
          } else {
            $channel = 'canary'
          }

          if ($refType -eq 'tag') {
            $version = $refName.TrimStart('v')
          } elseif ($channel -eq 'stable') {
            $version = $baseVersion
          } else {
            $version = "$baseVersion-$channel.$runNumber"
          }

          $numericCore = ($version -split '[-+]')[0]
          $assemblyVersion = "$numericCore.$runNumber"
          if ($channel -eq 'stable' -and $refType -eq 'tag' -and $version -notmatch '-') {
            $assemblyVersion = "$numericCore.0"
          }

          $publishPre = $false
          $publishRel = $false
          if ($eventName -eq 'workflow_dispatch') {
            $publishPre = ($publishMode -in @('pre-release', 'both'))
            $publishRel = ($publishMode -in @('release', 'both'))
          } elseif ($refType -eq 'tag') {
            if ($version -match '-') {
              $publishPre = $true
            } else {
              $publishRel = $true
            }
          } elseif ($eventName -eq 'schedule' -or $refName -in @('main', 'canary')) {
            $publishPre = $true
          }

          if ($refType -eq 'tag') {
            $releaseTag = $refName
            $prereleaseTag = "$refName-pre"
          } else {
            $releaseTag = "$channel-$version-$shortSha"
            $prereleaseTag = if ($channel -eq 'stable') { "v$baseVersion-pre.$runNumber" } else { $channel }
          }

          "channel=$channel" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "assembly_version=$assemblyVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "release_tag=$releaseTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "prerelease_tag=$prereleaseTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "publish_prerelease=$($publishPre.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "publish_release=$($publishRel.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

  build:
    name: Build & package (${{ needs.resolve.outputs.channel }})
    needs: resolve
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master

      - name: Cache Rust & Cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ needs.resolve.outputs.channel }}-${{ hashFiles('rust-toolchain.toml') }}
          shared-key: nectarlink-winui-x64

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-x64-${{ hashFiles('winui/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-x64-

      - name: Build native Rust DLLs (Release)
        run: cargo build --locked --release -p nectarlink-winui-core -p nectarlink-vcam -p nectarlink-credprov

      - name: Restore .NET & WinUI solution
        run: dotnet restore winui/NectarLink.WinUI.sln -p:Platform=x64

      - name: Build WinUI solution (Release)
        run: dotnet build winui/NectarLink.WinUI.sln -c Release -p:Platform=x64 --no-restore

      - name: Run Rust unit tests (networking & version checks)
        shell: pwsh
        run: |
          cargo test --locked -p nectarlink-core --lib session::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nectarlink-core --lib node::
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nectarlink-winui-core --lib version::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run WinUI native C ABI & bridge tests
        shell: pwsh
        run: |
          $testDir = 'winui\NectarLink.WinUI.Tests\bin\x64\Release\net10.0-windows10.0.22621.0'
          Copy-Item -Force 'target\release\nectarlink_winui_core.dll' "$testDir\nectarlink_winui_core.dll"
          & "$testDir\NectarLink.WinUI.Tests.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish self-contained WinUI bundle
        shell: pwsh
        run: |
          dotnet publish winui/NectarLink.WinUI/NectarLink.WinUI.csproj `
            -c Release `
            -p:Platform=x64 `
            -r win-x64 `
            --self-contained true `
            --no-restore `
            -p:Version=${{ needs.resolve.outputs.assembly_version }} `
            -p:InformationalVersion=${{ needs.resolve.outputs.version }} `
            -o "dist/Nectarlink-${{ needs.resolve.outputs.version }}-win-x64"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package zip, metadata & SHA-256 checksums
        shell: pwsh
        run: |
          $version = '${{ needs.resolve.outputs.version }}'
          $channel = '${{ needs.resolve.outputs.channel }}'
          $bundleDir = "dist\Nectarlink-$version-win-x64"
          Copy-Item -Force 'LICENSE' "$bundleDir\LICENSE.txt"
          Copy-Item -Force 'CHANGELOG.md' "$bundleDir\CHANGELOG.md"

          $zipName = "Nectarlink-$version-win-x64.zip"
          $zipPath = "dist\$zipName"
          Compress-Archive -Path "$bundleDir\*" -DestinationPath $zipPath -CompressionLevel Optimal -Force

          $hash = (Get-FileHash -Algorithm SHA256 -Path $zipPath).Hash.ToLowerInvariant()
          "$hash  $zipName" | Out-File -FilePath 'dist\SHA256SUMS.txt' -Encoding ascii

          @{
            channel = $channel
            version = $version
            commit = $env:GITHUB_SHA
            built_at = (Get-Date).ToUniversalTime().ToString('o')
            asset = $zipName
            sha256 = $hash
          } | ConvertTo-Json -Depth 3 | Out-File -FilePath 'dist\channel-manifest.json' -Encoding utf8

      - name: Upload workflow build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nectarlink-${{ needs.resolve.outputs.channel }}-${{ needs.resolve.outputs.version }}-win-x64
          path: |
            dist/Nectarlink-*.zip
            dist/SHA256SUMS.txt
            dist/channel-manifest.json
          retention-days: 30

      - name: Publish GitHub Pre-release
        if: needs.resolve.outputs.publish_prerelease == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = '${{ needs.resolve.outputs.prerelease_tag }}'
          $channel = '${{ needs.resolve.outputs.channel }}'
          $version = '${{ needs.resolve.outputs.version }}'
          $title = "NectarLink $version ($channel pre-release)"
          $notes = "Automated **$channel** pre-release build from ``$env:GITHUB_SHA``.`n`nVerify downloads against ``SHA256SUMS.txt``."
          $assets = @(
            "dist\Nectarlink-$version-win-x64.zip",
            "dist\SHA256SUMS.txt",
            "dist\channel-manifest.json"
          )

          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
            gh release edit $tag --prerelease --title $title --notes $notes
          } else {
            gh release create $tag @assets --prerelease --target $env:GITHUB_SHA --title $title --notes $notes
          }

      - name: Publish GitHub Release
        if: needs.resolve.outputs.publish_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = '${{ needs.resolve.outputs.release_tag }}'
          $channel = '${{ needs.resolve.outputs.channel }}'
          $version = '${{ needs.resolve.outputs.version }}'
          $title = "NectarLink $version ($channel)"
          $notes = "Official **$channel** release build from ``$env:GITHUB_SHA``.`n`nVerify downloads against ``SHA256SUMS.txt``."
          $assets = @(
            "dist\Nectarlink-$version-win-x64.zip",
            "dist\SHA256SUMS.txt",
            "dist\channel-manifest.json"
          )

          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
            gh release edit $tag --prerelease=false --title $title --notes $notes
          } else {
            gh release create $tag @assets --target $env:GITHUB_SHA --title $title --notes $notes
          }
