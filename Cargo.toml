[workspace]
resolver = "3"
members = [
    "core/nectarlink-adb",
    "core/nectarlink-protocol",
    "core/nectarlink-core",
    "core/nectarlink-cli",
    "core/nectarlink-ffi",
    "core/nectarlink-actions",
    "core/nectarlink-mcp",
    "native/nectarlink-winui-core",
    "native/vcam",
    "native/credprov",
    "tools/xtask",
]
# Patched crates, used through [patch.crates-io] below.
exclude = ["third_party"]

[workspace.package]
version = "0.1.5"
edition = "2024"
rust-version = "1.97"
authors = ["The NectarLink contributors"]
repository = "https://github.com/thtbee/nectarlink"

[workspace.metadata.release]
name = "Pollen"

[workspace.dependencies]
nectarlink-adb = { path = "core/nectarlink-adb", version = "0.1.5" }
nectarlink-protocol = { path = "core/nectarlink-protocol", version = "0.1.5" }
nectarlink-core = { path = "core/nectarlink-core", version = "0.1.5" }
nectarlink-actions = { path = "core/nectarlink-actions", version = "0.1.5" }
nectarlink-mcp = { path = "core/nectarlink-mcp", version = "0.1.5" }
nectarlink-vcam = { path = "native/vcam", version = "0.1.5" }

anyhow = "1"
ciborium = "0.2"
clap = { version = "4.6", features = ["derive"] }
data-encoding = "2.11"
dirs = "7"
hostname = "0.4"
hmac = "0.13"
iroh = "1.3"
noq-proto = { version = "~1.3", default-features = false }
iroh-mdns-address-lookup = "0.6"
material-colors = { version = "0.5", default-features = false, features = ["std", "quantize"] }
n0-future = "0.3"
qrcode = { version = "0.14", default-features = false }
rand = "0.10"
rusqlite = { version = "0.42", features = ["bundled"] }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"
blake3 = "1"
bytes = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
uniffi = "0.32"
tokio-util = "0.7"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "io-util", "sync", "time", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
windows = "0.62"
windows-collections = "0.3"
windows-core = "0.62"
embed-resource = "3"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[patch.crates-io]
iroh-mdns-address-lookup = { path = "third_party/iroh-mdns-address-lookup" }
